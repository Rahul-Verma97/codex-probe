[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex_probe"
version = "0.1.0"
description = "Record every LLM call the Codex CLI makes and swap its backend by config."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp==3.10.10",
  "jsonschema==4.23.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.3", "pytest-asyncio==0.24.0"]

[project.scripts]
codex-probe = "codex_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
